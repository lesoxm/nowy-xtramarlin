version: '3.8'

services:
  backend:
    build: ./backend
    container_name: xtramarlin-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/database.sqlite:/app/database.sqlite
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: xtramarlin-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
